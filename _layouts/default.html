<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <div class="header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% include nav.html %}
      </div>
      {% if page.hero_title %}
        <div class="hero">
          <h1 class="hero-title">{{ page.hero_title }}</h1>
          <p class="hero-text">{{ page.hero_text }}</p>
          <p class="hero-actions">
            <a class="button button-primary" href="{{ '/projects/' | relative_url }}">View projects</a>
            <a class="button" href="{{ site.resume | relative_url }}">Resume (PDF)</a>
          </p>
        </div>
      {% endif %}
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <p>© {{ site.time | date: "%Y" }} {{ site.author }}. <a href="{{ site.linkedin }}">LinkedIn</a></p>
      <p>Hosted on GitHub Pages.</p>
      <!-- Optional: add a line such as "Views are my own and do not represent IBM." if your employer's guidelines call for it. -->
    </footer>
  </body>
</html>
