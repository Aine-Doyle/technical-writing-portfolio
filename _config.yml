# Merge these settings into your existing _config.yml (keep your current theme line).
title: Aine Doyle’s Portfolio
description: Writing samples from my technical writing career at IBM
author: Aine Doyle
lang: en-US
theme: jekyll-theme-cayman
url: https://aine-doyle.github.io
baseurl: /technical-writing-portfolio

# Update the resume filename here whenever you upload a new PDF.
resume: /Aine_Doyle_Resume_August_2026.pdf
linkedin: https://www.linkedin.com/in/aine-doyle-a3b752139/

plugins:
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - PORTFOLIO-GUIDE.md
